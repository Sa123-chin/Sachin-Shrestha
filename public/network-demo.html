<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connected Network Background Demo</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: #e6ebf5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #040711;
    }

    /* Fixed full-viewport animated canvas behind all content */
    #network-canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #network-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .demo-content {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin: 120px auto;
      padding: 36px 32px;
      text-align: center;
      background: rgba(12, 18, 36, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(28, 42, 68, 0.85);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #e6ebf5;
    }

    h1 span {
      color: #19d3b0;
    }

    p {
      color: #9fb0cc;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- Fixed Background Canvas Wrapper -->
  <div id="network-canvas-wrap" aria-hidden="true">
    <canvas id="network-canvas"></canvas>
  </div>

  <div class="demo-content">
    <h1>Cinematic <span>Connected Network</span></h1>
    <p>
      Move your cursor over the page: observe the multi-depth parallax nodes, subtle geometric triangulation facets, breathing glowing halos, and organic fluid cursor interaction.
    </p>
  </div>

  <script>
    const canvas = document.getElementById("network-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    let animId;
    let width = 0;
    let height = 0;
    let particles = [];

    const mouse = {
      x: -9999,
      y: -9999,
      targetX: -9999,
      targetY: -9999,
      radius: 160,
    };

    const hasHover = window.matchMedia("(hover: hover)").matches;
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let isReducedMotion = motionQuery.matches;

    const LINK_DIST = 135;
    const TRIANGLE_MAX_DIST = 90;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      let targetCount = Math.round((width * height) / 9500);
      if (width < 640) targetCount = Math.round(targetCount * 0.55);
      targetCount = Math.max(25, Math.min(105, targetCount));

      particles = [];
      for (let i = 0; i < targetCount; i++) {
        const layer = 0.65 + Math.random() * 0.65;
        const isTeal = Math.random() < 0.25;

        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45 * layer,
          vy: (Math.random() - 0.5) * 0.45 * layer,
          r: (0.75 + Math.random() * 1.1) * (layer > 1 ? 1.2 : 0.9),
          layer,
          isTeal,
          pulsePhase: Math.random() * Math.PI * 2,
          pulseSpeed: 0.015 + Math.random() * 0.02,
        });
      }

      if (isReducedMotion) render();
    }

    function update() {
      if (isReducedMotion) return;

      if (hasHover && mouse.targetX > 0) {
        mouse.x += (mouse.targetX - mouse.x) * 0.12;
        mouse.y += (mouse.targetY - mouse.y) * 0.12;
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.pulsePhase += p.pulseSpeed;

        p.x += p.vx;
        p.y += p.vy;

        const margin = 20;
        if (p.x < -margin) { p.x = -margin; p.vx = Math.abs(p.vx); }
        else if (p.x > width + margin) { p.x = width + margin; p.vx = -Math.abs(p.vx); }

        if (p.y < -margin) { p.y = -margin; p.vy = Math.abs(p.vy); }
        else if (p.y > height + margin) { p.y = height + margin; p.vy = -Math.abs(p.vy); }

        if (hasHover && mouse.x > 0 && mouse.y > 0) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.hypot(dx, dy);

          if (dist < mouse.radius && dist > 0) {
            const force = (1 - dist / mouse.radius) * 1.5;
            const angle = Math.atan2(dy, dx);
            p.x += Math.cos(angle) * force * p.layer;
            p.y += Math.sin(angle) * force * p.layer;
          }
        }
      }
    }

    function render() {
      const bgGrad = ctx.createRadialGradient(
        width * 0.35,
        height * 0.25,
        50,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.95
      );
      bgGrad.addColorStop(0, "#0c1e3d");
      bgGrad.addColorStop(0.35, "#081329");
      bgGrad.addColorStop(0.7, "#060b1a");
      bgGrad.addColorStop(1, "#040711");

      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      const connectedPairs = [];

      for (let i = 0; i < particles.length; i++) {
        const a = particles[i];
        for (let j = i + 1; j < particles.length; j++) {
          const b = particles[j];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < LINK_DIST) {
            connectedPairs.push([i, j, dist]);
          }
        }
      }

      ctx.lineWidth = 0.5;
      for (let k = 0; k < connectedPairs.length; k++) {
        const [i, j, d1] = connectedPairs[k];
        if (d1 > TRIANGLE_MAX_DIST) continue;

        const a = particles[i];
        const b = particles[j];

        for (let m = k + 1; m < connectedPairs.length; m++) {
          const [i2, j2, d2] = connectedPairs[m];
          if (i2 !== i && j2 !== i && i2 !== j && j2 !== j) continue;

          const thirdIndex = i2 === i ? j2 : i2 === j ? j2 : j2 === i ? i2 : i2;
          if (thirdIndex === i || thirdIndex === j) continue;

          const c = particles[thirdIndex];
          const d3 = Math.hypot(b.x - c.x, b.y - c.y);

          if (d3 < TRIANGLE_MAX_DIST) {
            const avgDist = (d1 + d2 + d3) / 3;
            const facetAlpha = (1 - avgDist / TRIANGLE_MAX_DIST) * 0.045;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.lineTo(c.x, c.y);
            ctx.closePath();

            if (a.isTeal || b.isTeal || c.isTeal) {
              ctx.fillStyle = "rgba(25, 211, 176, " + (facetAlpha * 1.2) + ")";
            } else {
              ctx.fillStyle = "rgba(56, 189, 248, " + facetAlpha + ")";
            }
            ctx.fill();
            break;
          }
        }
      }

      for (let k = 0; k < connectedPairs.length; k++) {
        const [i, j, dist] = connectedPairs[k];
        const a = particles[i];
        const b = particles[j];

        const distRatio = 1 - dist / LINK_DIST;
        const avgLayer = (a.layer + b.layer) * 0.5;
        const lineAlpha = distRatio * 0.32 * Math.min(1.2, avgLayer);

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

        if (a.isTeal && b.isTeal) {
          ctx.strokeStyle = "rgba(25, 211, 176, " + (lineAlpha * 1.15) + ")";
          ctx.lineWidth = 0.85;
        } else if (a.isTeal || b.isTeal) {
          ctx.strokeStyle = "rgba(56, 189, 248, " + lineAlpha + ")";
          ctx.lineWidth = 0.75;
        } else {
          ctx.strokeStyle = "rgba(135, 195, 255, " + (lineAlpha * 0.85) + ")";
          ctx.lineWidth = 0.65;
        }

        ctx.stroke();
      }

      if (hasHover && mouse.x > 0 && mouse.y > 0) {
        for (let i = 0; i < particles.length; i++) {
          const a = particles[i];
          const mDist = Math.hypot(a.x - mouse.x, a.y - mouse.y);

          if (mDist < mouse.radius) {
            const mRatio = 1 - mDist / mouse.radius;
            const mAlpha = Math.pow(mRatio, 1.4) * 0.65;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = "rgba(25, 211, 176, " + mAlpha + ")";
            ctx.lineWidth = 0.95;
            ctx.stroke();
          }
        }
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const pulse = Math.sin(p.pulsePhase) * 0.25 + 1;
        const currentRadius = p.r * pulse;

        if (p.isTeal) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, currentRadius * 3, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(25, 211, 176, 0.16)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);
          ctx.fillStyle = "#19d3b0";
          ctx.fill();
        } else {
          if (p.layer > 0.9) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, currentRadius * 2.4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(186, 230, 253, 0.12)";
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);
          ctx.fillStyle = "#e2f1ff";
          ctx.globalAlpha = p.layer > 1 ? 0.85 : 0.65;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    function loop() {
      update();
      render();
      animId = requestAnimationFrame(loop);
    }

    function handleVisibilityChange() {
      if (document.hidden) {
        cancelAnimationFrame(animId);
      } else if (!isReducedMotion) {
        animId = requestAnimationFrame(loop);
      }
    }

    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", handleVisibilityChange);
    window.addEventListener("pointermove", (e) => {
      if (!hasHover) return;
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    }, { passive: true });
    document.addEventListener("pointerleave", () => {
      mouse.targetX = -9999;
      mouse.targetY = -9999;
      mouse.x = -9999;
      mouse.y = -9999;
    });

    motionQuery.addEventListener("change", (e) => {
      isReducedMotion = e.matches;
      if (isReducedMotion) {
        cancelAnimationFrame(animId);
        render();
      } else {
        loop();
      }
    });

    resize();
    if (!isReducedMotion) loop();
  </script>
</body>
</html>
