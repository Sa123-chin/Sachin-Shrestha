<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How I Can Help Your Team - Sachin Shrestha</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================================
       DESIGN TOKENS & CSS VARIABLES
       ========================================================================== */
    :root {
      --bg-page: #070b18;
      --bg-card: #0c1224;
      --bg-card-hover: #101830;
      --border-color: #1c2a44;
      --border-hover: #2a3d63;
      --text-main: #e6ebf5;
      --text-muted: #8d9ab5;
      --text-subtle: #576582;
      --teal-accent: #19d3b0;
      --teal-glow: rgba(25, 211, 176, 0.15);
      --teal-border: rgba(25, 211, 176, 0.35);
      --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --radius-pill: 9999px;
      --card-width: 232px;
      --card-gap: 12px;
      --transition-speed: 250ms;
      --transition-timing: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      min-height: 100vh;
      padding: 64px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Section Container */
    .how-i-help-section {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Top Header & Navigation Area */
    .section-header-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header-content {
      text-align: center;
    }

    .section-tag {
      font-family: monospace;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--teal-accent);
      margin-bottom: 8px;
      display: inline-block;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .title-accent-bar {
      height: 4px;
      width: 48px;
      background-color: var(--teal-accent);
      margin: 0 auto 14px auto;
      border-radius: var(--radius-pill);
    }

    .section-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Arrow Controls Bar (above row on the right) */
    .controls-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding-right: 4px;
    }

    .arrow-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-speed) var(--transition-timing);
    }

    .arrow-btn:hover:not(:disabled) {
      background-color: var(--bg-card-hover);
      color: var(--teal-accent);
      border-color: var(--teal-border);
      box-shadow: 0 0 10px var(--teal-glow);
    }

    .arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .arrow-btn:focus-visible {
      outline: 2px solid var(--teal-accent);
      outline-offset: 2px;
    }

    .arrow-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    /* ==========================================================================
       ONE HORIZONTAL SCROLLING ROW
       ========================================================================== */
    .scroll-row {
      display: flex;
      gap: var(--card-gap);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 8px 4px 18px 4px;
      outline: none;

      /* Hide Scrollbar */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
    }

    .scroll-row::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    .scroll-row:focus-visible {
      border-radius: var(--radius-lg);
      box-shadow: 0 0 0 2px var(--teal-accent);
    }

    /* ==========================================================================
       CARDS (232px wide, 12px gap, teal hover border)
       ========================================================================== */
    .card-item {
      flex: 0 0 var(--card-width);
      width: var(--card-width);
      min-width: var(--card-width);
      max-width: var(--card-width);
      scroll-snap-align: start;

      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px 18px;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;

      text-align: left;
      user-select: none;
      transition: border-color var(--transition-speed) var(--transition-timing),
                  transform var(--transition-speed) var(--transition-timing),
                  box-shadow var(--transition-speed) var(--transition-timing);
    }

    /* Hover effect: Border turns teal */
    .card-item:hover {
      border-color: var(--teal-accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4), 0 0 14px var(--teal-glow);
    }

    /* Small Teal Icon Tile */
    .card-icon-tile {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: rgba(25, 211, 176, 0.12);
      border: 1px solid var(--teal-border);
      color: var(--teal-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .card-icon-tile svg {
      width: 18px;
      height: 18px;
    }

    /* Bold Title */
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    /* Short Muted Description */
    .card-desc {
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* ==========================================================================
       DOTS INDICATOR (Active dot is a wider teal pill)
       ========================================================================== */
    .dots-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .indicator-dot {
      height: 8px;
      width: 8px;
      border-radius: var(--radius-pill);
      background-color: var(--border-color);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all var(--transition-speed) var(--transition-timing);
    }

    .indicator-dot:hover:not(.is-active) {
      background-color: var(--border-hover);
    }

    .indicator-dot:focus-visible {
      outline: 2px solid var(--teal-accent);
      outline-offset: 2px;
    }

    /* Active dot: wider teal pill */
    .indicator-dot.is-active {
      width: 26px;
      background-color: var(--teal-accent);
      box-shadow: 0 0 10px var(--teal-accent);
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <section class="how-i-help-section" id="how-i-help" aria-label="Operational Value">
    <!-- Header -->
    <header class="section-header-wrap">
      <div class="header-content">
        <span class="section-tag">Operational Value</span>
        <h2 class="section-title">How I Can Help Your Team</h2>
        <div class="title-accent-bar" aria-hidden="true"></div>
        <p class="section-subtitle">
          Practical human resources and systems operations designed to eliminate friction and foster clean organizational scaling.
        </p>
      </div>

      <!-- Previous & Next Navigation Buttons -->
      <div class="controls-bar" role="group" aria-label="Carousel navigation">
        <button
          type="button"
          class="arrow-btn"
          id="prev-btn"
          aria-label="Previous cards"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button
          type="button"
          class="arrow-btn"
          id="next-btn"
          aria-label="Next cards"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Horizontal Scrolling Row -->
    <div
      class="scroll-row"
      id="scroll-row"
      tabindex="0"
      role="region"
      aria-label="Operational value cards carousel"
    >
      <!-- Populated dynamically from JavaScript array -->
    </div>

    <!-- Dots Indicator with wider active teal pill -->
    <div
      class="dots-indicator"
      id="dots-indicator"
      role="tablist"
      aria-label="Card position indicators"
    >
      <!-- Populated dynamically via JS -->
    </div>
  </section>

  <script>
    /**
     * ==========================================================================
     * CARDS DATA STORE (7 cards with exact wording)
     * ==========================================================================
     */
    const cardsData = [
      {
        id: "help-1",
        title: "Build compliant HR systems from scratch",
        description: "Designing onboarding, payroll, and documentation workflows that hold up under audit.",
        // SVG: Shield Check
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>`
      },
      {
        id: "help-2",
        title: "Manage payroll across multiple countries without missed cycles",
        description: "Proven across Nepal, Hong Kong, Singapore, and Australia.",
        // SVG: Globe
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`
      },
      {
        id: "help-3",
        title: "Turn messy manual processes into digital systems",
        description: "Cut manual HR errors by 80% through structured HRMS implementation.",
        // SVG: CPU / Digital Systems
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>`
      },
      {
        id: "help-4",
        title: "Keep exits and offboarding 100% compliant",
        description: "Reducing legal and operational risk during employee transitions.",
        // SVG: User Offboarding / User Minus
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="22" y1="11" x2="16" y2="11"></line></svg>`
      },
      {
        id: "help-5",
        title: "Design performance systems people actually use",
        description: "KRA/KPI frameworks that improve accountability without adding bureaucracy.",
        // SVG: Trending Up / Performance
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`
      },
      {
        id: "help-6",
        title: "Bridge the gap between compliance and culture",
        description: "Policies that protect the company without making the workplace feel rigid.",
        // SVG: Scale / Balance
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>`
      },
      {
        id: "help-7",
        title: "Move fast without cutting corners",
        description: "Structured workflows catch and resolve issues quickly, not later.",
        // SVG: Zap / Fast Action
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`
      }
    ];

    /**
     * Escape HTML characters for safety
     */
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    /**
     * DOM Elements & Constants
     */
    const scrollRow = document.getElementById("scroll-row");
    const dotsContainer = document.getElementById("dots-indicator");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    const CARD_WIDTH = 232;
    const CARD_GAP = 12;
    const TOTAL_CARD_STEP = CARD_WIDTH + CARD_GAP; // 244px

    /**
     * Render Cards into Horizontal Row
     */
    function renderCards() {
      scrollRow.innerHTML = cardsData.map((item, index) => `
        <article
          class="card-item"
          id="help-card-${index}"
          data-index="${index}"
          aria-label="${escapeHtml(item.title)}"
        >
          <div class="card-icon-tile" aria-hidden="true">
            ${item.iconSvg}
          </div>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
          <p class="card-desc">${escapeHtml(item.description)}</p>
        </article>
      `).join('');
    }

    /**
     * Render Dots Indicator
     */
    function renderDots() {
      dotsContainer.innerHTML = cardsData.map((_, index) => `
        <button
          type="button"
          class="indicator-dot ${index === 0 ? 'is-active' : ''}"
          data-dot-index="${index}"
          aria-label="Go to card ${index + 1} of ${cardsData.length}"
          role="tab"
          aria-selected="${index === 0 ? 'true' : 'false'}"
        ></button>
      `).join('');
    }

    /**
     * Update active dot based on current scroll position
     */
    function updateActiveDot() {
      const scrollLeft = scrollRow.scrollLeft;
      // Calculate current card index based on scroll position
      const activeIndex = Math.min(
        cardsData.length - 1,
        Math.max(0, Math.round(scrollLeft / TOTAL_CARD_STEP))
      );

      const dots = dotsContainer.querySelectorAll(".indicator-dot");
      dots.forEach((dot, idx) => {
        const isActive = idx === activeIndex;
        dot.classList.toggle("is-active", isActive);
        dot.setAttribute("aria-selected", isActive ? "true" : "false");
      });

      // Update button disabled states if needed
      prevBtn.disabled = scrollLeft <= 5;
      nextBtn.disabled = scrollLeft >= (scrollRow.scrollWidth - scrollRow.clientWidth - 5);
    }

    /**
     * Scroll by exactly two cards smoothly
     */
    function scrollByTwoCards(direction) {
      const scrollAmount = TOTAL_CARD_STEP * 2; // (232 + 12) * 2 = 488px
      scrollRow.scrollBy({
        left: direction * scrollAmount,
        behavior: "smooth"
      });
    }

    /**
     * Scroll directly to a specific card index
     */
    function scrollToCard(index) {
      scrollRow.scrollTo({
        left: index * TOTAL_CARD_STEP,
        behavior: "smooth"
      });
    }

    /**
     * Event Listeners Setup
     */
    function setupEvents() {
      // Prev and Next arrow buttons
      prevBtn.addEventListener("click", () => scrollByTwoCards(-1));
      nextBtn.addEventListener("click", () => scrollByTwoCards(1));

      // Scroll listener to update active dot
      scrollRow.addEventListener("scroll", () => {
        requestAnimationFrame(updateActiveDot);
      }, { passive: true });

      // Click on dot indicators
      dotsContainer.addEventListener("click", (e) => {
        const dot = e.target.closest(".indicator-dot");
        if (!dot) return;
        const targetIndex = parseInt(dot.getAttribute("data-dot-index"), 10);
        scrollToCard(targetIndex);
      });

      // Keyboard left/right navigation when scroll row is focused
      scrollRow.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          scrollByTwoCards(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          scrollByTwoCards(1);
        }
      });

      // Initial update
      updateActiveDot();
    }

    // Initialize on DOM load
    document.addEventListener("DOMContentLoaded", () => {
      renderCards();
      renderDots();
      setupEvents();
    });
  </script>
</body>
</html>
