<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Experience - Sachin Shrestha</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================================
       DESIGN TOKENS & CSS VARIABLES
       ========================================================================== */
    :root {
      --bg-page: #070b18;
      --bg-card: #0c1224;
      --bg-card-hover: #111a33;
      --bg-card-selected: #0e172e;
      --border-color: #1c2a44;
      --border-hover: #2a3d63;
      --text-main: #e6ebf5;
      --text-muted: #8d9ab5;
      --text-subtle: #5a6885;
      --teal-accent: #19d3b0;
      --teal-glow: rgba(25, 211, 176, 0.15);
      --teal-border: rgba(25, 211, 176, 0.4);
      --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --radius-pill: 9999px;
      --transition-speed: 250ms;
      --transition-timing: cubic-bezier(0.4, 0, 0.2, 1);

      /* Icon Tile Themes */
      --odin-color: #a78bfa;
      --odin-bg: rgba(139, 92, 246, 0.12);
      --odin-border: rgba(139, 92, 246, 0.3);

      --vianet-color: #19d3b0;
      --vianet-bg: rgba(25, 211, 176, 0.12);
      --vianet-border: rgba(25, 211, 176, 0.3);

      --techone-color: #fb923c;
      --techone-bg: rgba(249, 115, 22, 0.12);
      --techone-border: rgba(249, 115, 22, 0.3);

      --jagdamba-color: #60a5fa;
      --jagdamba-bg: rgba(59, 130, 246, 0.12);
      --jagdamba-border: rgba(59, 130, 246, 0.3);
    }

    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      min-height: 100vh;
      padding: 56px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Section Container */
    .experience-section {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Section Header */
    .section-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .section-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 640px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ==========================================================================
       HORIZONTAL COMPANIES ROW (4 EQUAL COLUMNS DESKTOP, 2 COLS MOBILE)
       ========================================================================== */
    .companies-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 820px) {
      .companies-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .companies-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Company Selection Card Button */
    .company-card-btn {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      transition: all var(--transition-speed) var(--transition-timing);
    }

    .company-card-btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    /* Active / Selected state (teal 2px border) */
    .company-card-btn.is-selected {
      border: 2px solid var(--teal-accent);
      background-color: var(--bg-card-selected);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px var(--teal-glow);
      transform: translateY(-2px);
    }

    .company-card-btn:focus-visible {
      outline: 2px solid var(--teal-accent);
      outline-offset: 3px;
    }

    /* Top Row in Card */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Icon Tile */
    .icon-tile {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      flex-shrink: 0;
    }

    .icon-tile svg {
      width: 20px;
      height: 20px;
    }

    .icon-tile.odin {
      background: var(--odin-bg);
      border-color: var(--odin-border);
      color: var(--odin-color);
    }

    .icon-tile.vianet {
      background: var(--vianet-bg);
      border-color: var(--vianet-border);
      color: var(--vianet-color);
    }

    .icon-tile.techone {
      background: var(--techone-bg);
      border-color: var(--techone-border);
      color: var(--techone-color);
    }

    .icon-tile.jagdamba {
      background: var(--jagdamba-bg);
      border-color: var(--jagdamba-border);
      color: var(--jagdamba-color);
    }

    /* Headline Chip */
    .headline-chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: rgba(28, 42, 68, 0.45);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      white-space: nowrap;
      transition: all var(--transition-speed);
    }

    .company-card-btn.is-selected .headline-chip {
      background: var(--teal-glow);
      border-color: var(--teal-border);
      color: var(--teal-accent);
    }

    /* Card Middle Content */
    .card-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .company-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    .company-date-range {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-feature-settings: "tnum";
    }

    /* Active Arrow Indicator pointing to panel */
    .active-indicator {
      display: none;
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background-color: var(--bg-card);
      border-right: 2px solid var(--teal-accent);
      border-bottom: 2px solid var(--teal-accent);
      rotate: 45deg;
      z-index: 5;
    }

    .company-card-btn.is-selected .active-indicator {
      display: block;
    }

    /* Muted Hint Text */
    .selection-hint {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-subtle);
      margin: 14px 0 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity var(--transition-speed);
    }

    .selection-hint.is-hidden {
      display: none;
    }

    /* ==========================================================================
       DETAILS PANEL (OPENS DIRECTLY BELOW ROW)
       ========================================================================== */
    .details-panel-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--transition-speed) var(--transition-timing);
    }

    .details-panel-wrapper.is-open {
      grid-template-rows: 1fr;
    }

    .panel-outer {
      overflow: hidden;
    }

    .details-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      margin-top: 12px;
      position: relative;
    }

    @media (max-width: 640px) {
      .details-panel {
        padding: 24px 20px;
      }
    }

    /* Panel Header */
    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-company-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.015em;
    }

    .panel-date-span {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-feature-settings: "tnum";
    }

    /* Close Button in panel */
    .panel-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all var(--transition-speed);
    }

    .panel-close-btn:hover {
      color: var(--text-main);
      background: rgba(28, 42, 68, 0.5);
    }

    .panel-close-btn:focus-visible {
      outline: 2px solid var(--teal-accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       HORIZONTAL ROLE STEPPER (ODIN)
       ========================================================================== */
    .stepper-container {
      margin-bottom: 28px;
      padding: 16px 12px 20px 12px;
      background: rgba(7, 11, 24, 0.5);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    .stepper-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: block;
      text-align: center;
    }

    .stepper-track {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Continuous horizontal line behind dots */
    .stepper-line {
      position: absolute;
      top: 13px;
      left: 12%;
      right: 12%;
      height: 2px;
      background: var(--border-color);
      z-index: 1;
    }

    .step-item {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0 8px;
      flex: 1;
      text-align: center;
      transition: all var(--transition-speed);
    }

    .step-item:focus-visible {
      outline: 2px solid var(--teal-accent);
      outline-offset: 4px;
      border-radius: var(--radius-sm);
    }

    /* Step Dot */
    .step-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: all var(--transition-speed) var(--transition-timing);
    }

    .step-dot-inner {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      transition: background-color var(--transition-speed);
    }

    .step-item:hover .step-dot {
      border-color: var(--teal-accent);
      background: var(--bg-card-hover);
    }

    /* Selected Step */
    .step-item.is-active .step-dot {
      border-color: var(--teal-accent);
      background: var(--teal-accent);
      box-shadow: 0 0 14px var(--teal-accent);
    }

    .step-item.is-active .step-dot-inner {
      background: #070b18;
    }

    .step-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.2;
      transition: color var(--transition-speed);
    }

    .step-item.is-active .step-title {
      color: var(--teal-accent);
    }

    .step-date {
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-top: 3px;
      font-feature-settings: "tnum";
    }

    .step-item.is-active .step-date {
      color: var(--text-muted);
    }

    /* ==========================================================================
       ACTIVE ROLE DETAILS (TITLE, DATES, BULLETS)
       ========================================================================== */
    .role-detail-box {
      animation: fadeIn 200ms ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .role-detail-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 16px;
    }

    .role-main-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-badge {
      background: var(--teal-glow);
      color: var(--teal-accent);
      border: 1px solid var(--teal-border);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .role-timing {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-weight: 500;
      font-feature-settings: "tnum";
    }

    /* Bullet Points with Teal Markers */
    .bullets-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bullet-item {
      position: relative;
      padding-left: 22px;
      font-size: 0.925rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .bullet-item::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--teal-accent);
      box-shadow: 0 0 6px rgba(25, 211, 176, 0.4);
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="experience-section">
    <!-- Header -->
    <header class="section-header">
      <h1 class="section-title">Professional Experience</h1>
      <p class="section-subtitle">
        A career built on HR leadership, compliance, and digital systems. Select a company to see how my responsibilities grew over time.
      </p>
    </header>

    <!-- 1) Four Companies in ONE Horizontal Row -->
    <section
      class="companies-grid"
      id="companies-grid"
      role="region"
      aria-label="Companies list"
    >
      <!-- Generated via JS -->
    </section>

    <!-- Muted Hint -->
    <div class="selection-hint" id="selection-hint" aria-live="polite">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Select a company to see the details</span>
    </div>

    <!-- 2) Details Panel directly below the row -->
    <section
      class="details-panel-wrapper"
      id="details-panel-wrapper"
      aria-live="polite"
    >
      <div class="panel-outer">
        <div class="details-panel" id="details-panel-content">
          <!-- Populated when a card is selected -->
        </div>
      </div>
    </section>
  </main>

  <script>
    /**
     * ==========================================================================
     * DATA STORE
     * All experience content structured with full bullets from earlier prompt.
     * ==========================================================================
     */
    const data = [
      {
        id: "odin",
        company: "Odin Mortgage & Tax",
        dateSpan: "Sep 2025 – Present",
        headlineChip: "4-country payroll",
        iconClass: "odin",
        // Icon SVG definition
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`,
        // Multiple roles: Stepper ordered oldest to newest (left to right)
        roles: [
          {
            id: "officer",
            stepLabel: "Officer",
            title: "People Operations Officer",
            date: "Sep 2025 – Dec 2025",
            isCurrent: false,
            bullets: [
              "Prepared, issued, and maintained employment contracts, variations, NDAs, and HR documentation audit-ready at all times",
              "Tracked probation milestones and documentation deadlines with line managers",
              "Managed end-to-end payroll across 4 countries (Nepal, Hong Kong, Singapore, Australia) under differing tax and statutory rules",
              "Ensured salaries, commissions, statutory contributions, and adjustments were processed accurately and on time",
              "Investigated and resolved payroll discrepancies using structured workflows and documented processes"
            ]
          },
          {
            id: "specialist",
            stepLabel: "Specialist",
            title: "People Operations Specialist",
            date: "Jan 2026 – Apr 2026",
            isCurrent: false,
            bullets: [
              "Supported HRIS management and cross-regional payroll coordination",
              "Contributed to onboarding and compliance documentation processes"
            ]
          },
          {
            id: "lead",
            stepLabel: "Lead",
            title: "People Operations & System Lead",
            date: "May 2026 – Present",
            isCurrent: true,
            bullets: [
              "Design and implement Management Operating Systems (scorecards, huddles, coaching loops) adopted across all levels",
              "Define primary outputs and guardrails for every team and manager role",
              "Build and maintain a decisions-grade dashboard: binary, objective, and trusted by leadership",
              "Own the performance review framework: cadence, structure, documentation, and audit-readiness",
              "Own end-to-end, multi-region payroll (salaries, commissions, statutory contributions), accurate and on time",
              "Prepare and manage employment contracts, NDAs, and all HR documentation pre- and post-hire",
              "Drive manager enablement through SOPs, templates, and role clarity frameworks",
              "Maintain HRIS data integrity and run compliant onboarding and offboarding at scale"
            ]
          }
        ],
        // Default role to display in stepper: Lead
        defaultRoleIndex: 2
      },
      {
        id: "vianet",
        company: "Vianet Communication Limited",
        dateSpan: "May 2024 – Sep 2025",
        headlineChip: "KRA/KPI system",
        iconClass: "vianet",
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>`,
        roles: [
          {
            id: "hr-officer",
            stepLabel: "HR Officer",
            title: "HR Officer",
            date: "May 2024 – Sep 2025",
            isCurrent: false,
            bullets: [
              "Oversaw HR functions across the organization: onboarding, training, performance reviews, and policy compliance",
              "Introduced a structured induction program that improved the onboarding experience",
              "Designed and implemented an HR workflow process that streamlined operations organization-wide",
              "Rolled out a KRA/KPI-based performance evaluation system, improving accountability and goal alignment",
              "Revised job descriptions across all levels and departments for accurate role clarity",
              "Prevented resignation of key talent through proactive engagement, addressing grievances before escalation"
            ]
          }
        ]
      },
      {
        id: "techone",
        company: "Techone Global Nepal",
        dateSpan: "Aug 2023 – May 2024",
        headlineChip: "ISO certification",
        iconClass: "techone",
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`,
        roles: [
          {
            id: "junior-exec",
            stepLabel: "Junior Executive",
            title: "Junior Executive, People and Culture",
            date: "Aug 2023 – May 2024",
            isCurrent: false,
            bullets: [
              "Managed daily People & Culture operations, leading full-cycle recruitment, onboarding, training, and offboarding",
              "Coordinated annual performance review cycles with 100% timely completion",
              "Ran Microsoft Office training sessions with 95% employee attendance",
              "Played a pivotal role in the company's ISO standard certification",
              "Contributed to the company being recognized as a \"Best Place to Work\"",
              "Liaised with Finance and Admin on EPF/CIT enrollment and compliance documentation"
            ]
          }
        ]
      },
      {
        id: "jagdamba",
        company: "Jagdamba Steels Limited",
        dateSpan: "Dec 2021 – May 2023",
        headlineChip: "80% fewer errors",
        iconClass: "jagdamba",
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>`,
        roles: [
          {
            id: "junior-officer",
            stepLabel: "Junior Officer",
            title: "Junior Officer, HR and Admin",
            date: "Dec 2021 – May 2023",
            isCurrent: false,
            bullets: [
              "Managed end-to-end recruitment (sourcing, screening, interviews, onboarding) with full documentation compliance",
              "Implemented digital record-keeping via HRMS, reducing manual errors by 80%",
              "Improved monthly HR reporting efficiency by automating key data collection",
              "Introduced a structured clearance process ensuring 100% compliance during employee exits",
              "Coordinated with factory HR teams on recruitment, onboarding, and contract renewals",
              "Managed attendance tracking, travel/allowance processing, and monthly HR reporting on manpower and attrition"
            ]
          }
        ]
      }
    ];

    // State management: selectedCompanyId, and selectedRoleIndex for stepper
    let selectedCompanyId = null;
    let selectedRoleIndex = 0;

    /**
     * Escape special HTML characters
     */
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    /**
     * Render the 4 cards in the horizontal row
     */
    function renderCompanyGrid() {
      const grid = document.getElementById("companies-grid");
      if (!grid) return;

      grid.innerHTML = data.map((item) => {
        const isSelected = selectedCompanyId === item.id;
        return `
          <button
            type="button"
            class="company-card-btn ${isSelected ? 'is-selected' : ''}"
            id="btn-company-${item.id}"
            data-id="${item.id}"
            aria-expanded="${isSelected ? 'true' : 'false'}"
            aria-controls="details-panel-wrapper"
          >
            <div class="card-top">
              <div class="icon-tile ${item.iconClass}" aria-hidden="true">
                ${item.iconSvg}
              </div>
              <span class="headline-chip">${escapeHtml(item.headlineChip)}</span>
            </div>

            <div class="card-content">
              <h2 class="company-title">${escapeHtml(item.company)}</h2>
              <time class="company-date-range">${escapeHtml(item.dateSpan)}</time>
            </div>

            <div class="active-indicator" aria-hidden="true"></div>
          </button>
        `;
      }).join('');
    }

    /**
     * Render the detailed panel below the grid
     */
    function renderDetailsPanel() {
      const wrapper = document.getElementById("details-panel-wrapper");
      const content = document.getElementById("details-panel-content");
      const hint = document.getElementById("selection-hint");

      if (!selectedCompanyId) {
        wrapper.classList.remove("is-open");
        hint.classList.remove("is-hidden");
        return;
      }

      hint.classList.add("is-hidden");
      wrapper.classList.add("is-open");

      const company = data.find(c => c.id === selectedCompanyId);
      if (!company) return;

      const hasMultipleRoles = company.roles.length > 1;
      const currentRole = company.roles[selectedRoleIndex] || company.roles[0];

      // Stepper HTML for multi-role companies (e.g. Odin)
      let stepperHtml = '';
      if (hasMultipleRoles) {
        stepperHtml = `
          <div class="stepper-container">
            <span class="stepper-label">Career Progression (Oldest → Newest)</span>
            <div class="stepper-track" role="tablist" aria-label="Role progression steps">
              <div class="stepper-line" aria-hidden="true"></div>
              ${company.roles.map((r, idx) => `
                <button
                  type="button"
                  class="step-item ${idx === selectedRoleIndex ? 'is-active' : ''}"
                  role="tab"
                  aria-selected="${idx === selectedRoleIndex ? 'true' : 'false'}"
                  data-role-idx="${idx}"
                >
                  <div class="step-dot">
                    <div class="step-dot-inner"></div>
                  </div>
                  <span class="step-title">${escapeHtml(r.stepLabel)}</span>
                  <span class="step-date">${escapeHtml(r.date.split('–')[0].trim())}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Details HTML
      content.innerHTML = `
        <header class="panel-header">
          <div class="panel-title-wrap">
            <h3 class="panel-company-name">${escapeHtml(company.company)}</h3>
            <span class="panel-date-span">${escapeHtml(company.dateSpan)}</span>
          </div>
          <button type="button" class="panel-close-btn" id="close-panel-btn" aria-label="Close details panel">
            <span>Close</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>

        ${stepperHtml}

        <article class="role-detail-box" id="role-detail-box">
          <div class="role-detail-header">
            <h4 class="role-main-title">
              <span>${escapeHtml(currentRole.title)}</span>
              ${currentRole.isCurrent ? '<span class="current-badge">Current</span>' : ''}
            </h4>
            <span class="role-timing">${escapeHtml(currentRole.date)}</span>
          </div>

          <ul class="bullets-list">
            ${currentRole.bullets.map(b => `
              <li class="bullet-item">${escapeHtml(b)}</li>
            `).join('')}
          </ul>
        </article>
      `;

      // Attach Stepper Listeners
      if (hasMultipleRoles) {
        content.querySelectorAll(".step-item").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedRoleIndex = parseInt(btn.getAttribute("data-role-idx"), 10);
            renderDetailsPanel();
          });
        });
      }

      // Attach Close Panel Button Listener
      const closeBtn = content.querySelector("#close-panel-btn");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          selectedCompanyId = null;
          renderCompanyGrid();
          renderDetailsPanel();
        });
      }
    }

    /**
     * Card click toggle logic
     */
    function handleCompanyCardClick(companyId) {
      if (selectedCompanyId === companyId) {
        // Toggle off if already selected
        selectedCompanyId = null;
      } else {
        selectedCompanyId = companyId;
        const comp = data.find(c => c.id === companyId);
        // Default Odin to Lead (index 2); other companies index 0
        selectedRoleIndex = comp && comp.defaultRoleIndex !== undefined ? comp.defaultRoleIndex : 0;
      }

      renderCompanyGrid();
      renderDetailsPanel();

      // Smoothly scroll down so panel is well visible on smaller viewports
      if (selectedCompanyId && window.innerWidth <= 820) {
        setTimeout(() => {
          const panel = document.getElementById("details-panel-wrapper");
          if (panel) {
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
        }, 100);
      }
    }

    /**
     * Event setup
     */
    function setupApp() {
      const grid = document.getElementById("companies-grid");

      // Event delegation for card clicks
      grid.addEventListener("click", (e) => {
        const btn = e.target.closest(".company-card-btn");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        handleCompanyCardClick(id);
      });

      renderCompanyGrid();
      renderDetailsPanel();
    }

    // Initialize when DOM is ready
    document.addEventListener("DOMContentLoaded", setupApp);
  </script>
</body>
</html>
